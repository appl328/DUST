<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DUST · 이전 데이터 내보내기</title><link rel="icon" href="./favicon-48.png"><style>:root{color-scheme:light}*{box-sizing:border-box}body{font:15px/1.7 -apple-system,BlinkMacSystemFont,sans-serif;background:#ececf0;color:#1d1d1f;margin:0;padding:24px 16px}main{max-width:600px;margin:auto;background:white;border:1px solid #d9d9df;border-radius:18px;padding:24px}a{color:#0a84ff}h1{font-size:22px}p{font-size:13px;color:#686871}button{font:inherit;border:0;border-radius:11px;background:#0a84ff;color:white;min-height:44px;padding:10px 16px;margin:6px 0;display:block;width:100%;cursor:pointer}button:disabled{opacity:.5}#status{overflow-wrap:anywhere}</style></head><body><main><a href="./index.html">← DUST</a><h1>이전 작가 데이터 내보내기</h1><p>이전에 사용하던 DUST와 같은 주소·브라우저에서 열어야 함<br>이 화면은 데이터를 읽기만 하며, 기존 저장 내용을 삭제하지 않음</p><button id="stats">Artist Tags 통계 JSON 저장</button><button id="plus">Artist Tags + 전체 백업</button><p id="status" role="status"></p><p>fluff의 Artist Tags에서는 통계 JSON을 직접 선택하면 됨<br>Artist Tags +에서는 ‘전체 불러오기’로 백업을 넣으면 됨</p></main><script>
const status=document.getElementById('status'),folder=new URL('./',location.href).pathname;
async function readOld(name,store,key){const db=await new Promise((resolve,reject)=>{const r=indexedDB.open(name+folder);r.onupgradeneeded=()=>r.transaction.abort();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(new Error('이 주소의 브라우저에 저장된 데이터가 없음 · 예전에 사용하던 주소와 브라우저인지 확인해 주세요'));});try{return await new Promise((resolve,reject)=>{const tx=db.transaction(store,'readonly'),req=key?tx.objectStore(store).get(key):tx.objectStore(store).getAll();req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}finally{db.close();}}
function save(data,name){const url=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);}
const dataURL=b=>new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.readAsDataURL(b);});
async function run(fn){document.querySelectorAll('button').forEach(b=>b.disabled=true);status.textContent='백업 준비 중…';try{await fn();status.textContent='다운로드 완료 · fluff에서 파일을 불러오면 됨';}catch(e){status.textContent=e.message;}finally{document.querySelectorAll('button').forEach(b=>b.disabled=false);}}
document.getElementById('stats').onclick=()=>run(async()=>{const data=await readOld('dust_artist_stats_v1:','current','last');if(!data)throw new Error('저장된 통계 데이터가 없음');save(data.data,'dust-artist-stats-transfer.json');});
document.getElementById('plus').onclick=()=>run(async()=>{const all=await readOld('dust_artist_plus_v1:','entries');if(!all.length)throw new Error('저장된 작가 카드가 없음');const entries=[];for(const e of all){const images=[];for(const im of e.images)images.push({id:im.id,name:im.name,data:await dataURL(im.blob)});entries.push({...e,images});}save({format:'dust-artist-plus',version:1,exportedAt:new Date().toISOString(),entries},'dust-artist-plus-transfer.json');});
</script></body></html>
