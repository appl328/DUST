<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>ASCII STUDIO — 사진과 글자를 문자로</title><meta name="description" content="이미지와 한글·영문 텍스트를 아스키아트로 변환하고 복사하거나 저장하세요. 모든 변환은 기기에서 처리됩니다."><link rel="icon" href="./favicon-48.png"><style>
:root{color-scheme:light;--ink:#1d1d1f;--muted:#77777d;--line:rgba(60,60,67,.16);--accent:#0a84ff;--bg:#ececf0}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,'SF Pro Text','Apple SD Gothic Neo',sans-serif;touch-action:manipulation}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}main{padding:4px 2px 14px;margin:auto;max-width:1200px}.workspace{display:grid;grid-template-columns:260px minmax(0,1fr);gap:14px;align-items:start}.panel{min-width:0;background:rgba(255,255,255,.8);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 8px 24px #00000006}.tabs{display:flex;gap:4px;background:rgba(118,118,128,.14);padding:4px;border-radius:12px;margin:0 0 16px}.tabs button{flex:1;min-width:0;min-height:44px;border:0;background:none;padding:8px 3px;border-radius:9px;font-size:13px;font-weight:700;white-space:nowrap}.tabs button[aria-selected=true]{background:white;box-shadow:0 1px 4px #0002}.label{display:flex;justify-content:space-between;gap:8px;margin:16px 0 6px;font-size:12px;font-weight:700;color:var(--muted)}.label:first-child{margin-top:0}output{font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink)}textarea,select,input[type=text]{width:100%;border:1px solid var(--line);border-radius:11px;background:#fff;padding:10px;font-size:16px;min-height:44px}textarea{resize:vertical;min-height:90px}input[type=range]{width:100%;accent-color:var(--accent);min-height:28px;margin:0}input[type=checkbox]{accent-color:var(--accent);width:18px;height:18px}.drop{display:block;text-align:center;padding:18px 10px;border:1px dashed #b6bbc4;border-radius:12px;background:#f4f5f8;cursor:pointer}.drop strong{display:block;font-size:13px}.drop small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.drop .symbol{display:grid;place-items:center;width:30px;height:30px;background:#e4efff;color:var(--accent);border-radius:8px;font-size:24px;line-height:1;margin:0 auto 8px}.drop.drag{background:#e1edff;border-color:var(--accent)}.sample{width:100%;border:0;background:none;font-size:12px;color:var(--accent);min-height:40px;padding:8px}.check{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;min-height:32px}.hint{font-size:11px;color:var(--muted);margin:12px 0 0;line-height:1.7}.preview{padding:0;overflow:hidden;display:flex;flex-direction:column;min-height:480px;position:sticky;top:4px}.toolbar{padding:14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);gap:8px;flex-wrap:wrap}.kicker{font-size:12px;font-weight:700;color:var(--muted)}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{border:0;border-radius:10px;background:rgba(118,118,128,.14);min-height:40px;padding:8px 11px;font-size:12px;font-weight:700}.actions .primary{background:var(--accent);color:white}.stage{background:#e4e5eb;flex:1;padding:14px;min-height:360px;display:flex;align-items:center;justify-content:center;overflow:hidden}.paper{max-width:100%;max-height:65vh;overflow:auto;padding:16px;background:white;box-shadow:0 4px 16px #0000000a;border:1px solid var(--line);border-radius:10px}pre{font:10px/1 'Courier New',monospace;margin:0;white-space:pre;letter-spacing:0;font-variant-ligatures:none}.footer{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--muted);gap:8px}.bottom{margin:12px 4px 0;font-size:11px;color:var(--muted);line-height:1.7}.bottom span{display:block}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222e;color:#fff;padding:10px 16px;border-radius:14px;z-index:3;width:max-content;max-width:90%;text-align:center;font-size:12px}.hidden,[hidden]{display:none!important}.zoom{display:flex;align-items:center;gap:8px}.zoom input{width:80px}#sourceThumb{max-width:100%;max-height:90px;margin:10px auto 0;display:block;border-radius:8px}#phraseCanvas{display:block;max-width:100%;height:auto}.paper:has(#phraseCanvas:not([hidden])){width:100%}.phrase-note{line-height:1.6}.preview-link{display:none}.settings-extra{margin-top:12px}.settings-extra summary{cursor:pointer;font-size:12px;font-weight:700;color:var(--muted);min-height:40px;line-height:40px;border-top:1px solid var(--line)}
@media(max-width:659px){.workspace{grid-template-columns:1fr;gap:12px}.panel{padding:14px}.preview{padding:0;min-height:340px;position:static}.stage{min-height:260px;padding:10px}.paper{padding:12px}.preview-link{display:block;text-align:center;font-size:12px;color:var(--accent);text-decoration:none;min-height:36px;line-height:36px;margin-top:10px}.toolbar{padding:12px}.tabs{margin-bottom:12px}}
</style></head><body><main><div class="workspace"><aside class="panel"><div class="tabs" role="tablist" aria-label="변환 모드"><button id="imageTab" role="tab" aria-selected="true">이미지</button><button id="textTab" role="tab" aria-selected="false">텍스트</button><button id="phraseTab" role="tab" aria-selected="false">문구로 사진</button></div><section id="imageControls"><label class="drop" id="drop" for="file"><span class="symbol" aria-hidden="true">+</span><strong>이미지 선택 또는 끌어놓기</strong><small>JPG · PNG · WEBP · GIF / 최대 20MB</small><img id="sourceThumb" alt="선택한 이미지" hidden></label><input type="file" id="file" accept="image/*" hidden><button class="sample" id="sample">샘플 이미지로 시험하기</button><div id="classicSettings"><label class="label" for="width">가로 문자 수 <output id="widthValue">100</output></label><input id="width" type="range" min="30" max="200" value="100"></div><div id="phraseControls" hidden><label class="label" for="phrase">사진을 채울 문구</label><textarea id="phrase" maxlength="5000" placeholder="반복해서 그릴 문구 입력">피피바보 </textarea><label class="label" for="phraseSize">글자 크기 <output id="phraseSizeValue">10</output></label><input id="phraseSize" type="range" min="6" max="32" step="1" value="10"><p class="hint phrase-note">선택한 크기를 모든 글자에 동일하게 적용함<br>색상·굵기는 고정됨<br>사진에 맞춰 자간·행간을 자동 배치함<br>어두운 곳은 최대 60% 겹치게, 밝은 곳은 성기게<br>문구는 순서대로 반복 · 결과 보관은 PNG 저장</p></div><details class="settings-extra"><summary>변환 세부 설정</summary><label class="label" for="contrast">대비 <output id="contrastValue">1.0</output></label><input id="contrast" type="range" min="0.3" max="2.5" step="0.1" value="1"><label class="label" for="brightness">밝기 <output id="brightnessValue">0</output></label><input id="brightness" type="range" min="-100" max="100" value="0"><div id="charsetSettings"><label class="label" for="charset">문자 스타일</label><select id="charset"><option value="classic">클래식 · @%#*+=-:.</option><option value="detail">디테일 · $B8&WM#</option><option value="block">블록 · █▓▒░</option><option value="binary">바이너리 · 01</option></select></div><label class="check"><input id="invert" type="checkbox">명암 반전</label><label class="check"><input id="color" type="checkbox">원본 색상 사용</label><p class="hint">투명한 배경은 흰색으로 처리됨<br>GIF는 첫 프레임으로 변환됨</p></details></section><section id="textControls" hidden><label class="label" for="text">변환할 글자</label><textarea id="text" maxlength="100" placeholder="한글도 영문도 입력">HELLO</textarea><label class="label" for="textStyle">글자 스타일</label><select id="textStyle"><option value="bold">볼드</option><option value="outline">아웃라인</option><option value="serif">세리프</option></select><label class="label" for="textSize">글자 크기 <output id="textSizeValue">16</output></label><input id="textSize" type="range" min="10" max="28" value="16"><label class="label" for="ink">채울 문자</label><select id="ink"><option value="#"># 해시</option><option value="@">@ 골뱅이</option><option value="*">* 별표</option><option value="█">█ 블록</option><option value="01">01 바이너리</option></select><p class="hint">한글·영문·숫자 지원<br>긴 문장은 줄을 나눠 입력하면 보기 편함</p></section><a class="preview-link" href="#preview">변환 결과 보기 ↓</a></aside><section class="panel preview" id="preview"><div class="toolbar"><span class="kicker">미리보기</span><div class="actions"><button id="copy" class="primary">복사</button><button id="txt">TXT 저장</button><button id="png">PNG 저장</button></div></div><div class="stage"><div class="paper"><canvas id="phraseCanvas" hidden aria-label="입력한 문구로 그린 사진"></canvas><pre id="art" aria-label="아스키아트 변환 결과"></pre></div></div><div class="footer"><span id="stats" aria-live="polite"></span><label class="zoom">확대 <input id="zoom" type="range" min="4" max="18" value="9" aria-label="미리보기 문자 크기"></label></div></section></div><div class="bottom"><span>복사한 아트는 고정폭 글꼴에서 형태가 유지됨</span><span>이미지는 기기 안에서만 처리됨 · 서버 전송 없음</span></div></main><div id="toast" class="toast" role="status" hidden></div><script>
const $=id=>document.getElementById(id);let mode='image',source=null,result='',cells=[],rows=0,cols=0,timer;const sets={classic:'@%#*+=-:. ',detail:'$B8&WM#*oahkbdpqwmZO0QLCJUYXzcvunxrjft/\\|()1{}[]?-_+~<>i!lI;:,"^`. ',block:'█▓▒░ ',binary:'01 '};
function toast(s){$('toast').textContent=s;$('toast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('toast').hidden=true,2600)}
function setMode(m){mode=m;$('imageControls').hidden=m==='text';$('textControls').hidden=m!=='text';$('phraseControls').hidden=m!=='phrase';$('classicSettings').hidden=m==='phrase';$('charsetSettings').hidden=m==='phrase';$('color').closest('label').hidden=m==='phrase';$('art').hidden=m==='phrase';$('phraseCanvas').hidden=m!=='phrase';document.querySelector('.zoom').hidden=m==='phrase';for(const name of ['image','text','phrase'])$(name+'Tab').setAttribute('aria-selected',m===name);render()}
for(const name of ['image','text','phrase']){$(name+'Tab').onclick=()=>setMode(name);$(name+'Tab').onkeydown=e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();const modes=['image','text','phrase'];setMode(modes[(modes.indexOf(mode)+(e.key==='ArrowRight'?1:2))%3]);$(mode+'Tab').focus()}}}
function renderPhrase(){
const raw=$('phrase').value.replace(/\s+/gu,' '),chars=typeof Intl.Segmenter==='function'?Array.from(new Intl.Segmenter('ko',{granularity:'grapheme'}).segment(raw),p=>p.segment):Array.from(raw);
const out=$('phraseCanvas'),ctx=out.getContext('2d');out.width=1000;out.height=Math.max(1,Math.round(1000*source.height/source.width));if(out.height>1600){out.width=Math.max(1,Math.round(1600*source.width/source.height));out.height=1600}ctx.fillStyle='white';ctx.fillRect(0,0,out.width,out.height);
if(!raw.trim()){result='';cells=[];rows=cols=0;$('stats').textContent='사진을 채울 문구를 입력해 주세요';return}
const sample=canvas(out.width,out.height),sx=sample.getContext('2d',{willReadFrequently:true});sx.fillStyle='white';sx.fillRect(0,0,sample.width,sample.height);sx.drawImage(source,0,0,sample.width,sample.height);const pixels=sx.getImageData(0,0,sample.width,sample.height).data;
// Fixed ink and typography. Only spatial intervals encode tone.
const size=+$('phraseSize').value;ctx.font=`400 ${size}px "Apple SD Gothic Neo", "Malgun Gothic", monospace`;ctx.textBaseline='top';ctx.fillStyle='#111111';
const widths=chars.map(c=>Math.max(3,ctx.measureText(c).width)),nextY=new Float32Array(out.width);let index=0,lines=[];cells=[];
function darkness(x,y,w){let total=0,n=0;for(let yy=Math.floor(y);yy<Math.min(out.height,y+size);yy+=2)for(let xx=Math.floor(x);xx<Math.min(out.width,x+w);xx+=2){const i=(yy*out.width+xx)*4;total+=.2126*pixels[i]+.7152*pixels[i+1]+.0722*pixels[i+2];n++}let v=Math.max(0,Math.min(255,((n?total/n:255)-128)*+$('contrast').value+128+ +$('brightness').value));if($('invert').checked)v=255-v;return 1-v/255}
for(let y=0;y+size<=out.height;y+=2){let line='';for(let x=0;x<out.width;){const n=index%chars.length,ch=chars[n],w=widths[n];if(x+w>out.width)break;let blocked=false;for(let j=Math.floor(x);j<Math.ceil(x+w*.4);j++)if(nextY[j]>y){blocked=true;break}if(blocked){x+=2;continue}const d=darkness(x,y,w);if(d<.025){x+=2;continue}const spacing=1/Math.sqrt(Math.max(.025,d)),horizontalStep=w*.4+(w+size)*(spacing-1),verticalStep=size*.4+size*1.8*(spacing-1);ctx.fillText(ch,x,y);cells.push({ch,x,y,w,font:ctx.font,color:ctx.fillStyle});for(let j=Math.floor(x);j<Math.min(out.width,Math.ceil(x+w*.4));j++)nextY[j]=y+verticalStep;line+=ch;index++;x+=horizontalStep}if(line)lines.push(line)}
result=lines.join('\n');rows=lines.length;cols=0;$('stats').textContent=`${out.width} × ${out.height}px · ${cells.length} 문자 · 자동 밀도 배치`;

}
function canvas(w,h){let c=document.createElement('canvas');c.width=w;c.height=h;return c}
function textPixels(){const lines=$('text').value.replace(/\r/g,'').split('\n').slice(0,8),size=+$('textSize').value*2,c=canvas(1,1),x=c.getContext('2d',{willReadFrequently:true});const font=`900 ${size}px ${$('textStyle').value==='serif'?'Georgia, serif':'Arial, "Apple SD Gothic Neo", sans-serif'}`;x.font=font;let w=Math.ceil(Math.max(1,...lines.map(l=>x.measureText(l).width)))+8,h=lines.length*(size+8)+8;c.width=Math.min(w,5000);c.height=h;x.fillStyle='white';x.fillRect(0,0,c.width,h);x.font=font;x.textBaseline='top';x.fillStyle='black';x.strokeStyle='black';x.lineWidth=1.3;lines.forEach((l,i)=>{$('textStyle').value==='outline'?x.strokeText(l,4,i*(size+8)+4):x.fillText(l,4,i*(size+8)+4)});return c}
function render(){for(const id of ['width','contrast','brightness','textSize','phraseSize'])$(id+'Value').textContent=id==='contrast'?(+$(id).value).toFixed(1):$(id).value;if(mode==='phrase'){if(source)renderPhrase();return}const src=mode==='text'?textPixels():source;if(!src)return;cols=mode==='image'?+$('width').value:Math.ceil(src.width/1.3);rows=Math.min(350,Math.max(1,Math.round(src.height/src.width*cols*.5)));const c=canvas(cols,rows),x=c.getContext('2d',{willReadFrequently:true});x.fillStyle='white';x.fillRect(0,0,cols,rows);x.drawImage(src,0,0,cols,rows);const data=x.getImageData(0,0,cols,rows).data;let lines=[],fragment=document.createDocumentFragment();cells=[];for(let y=0;y<rows;y++){let line='';for(let j=0;j<cols;j++){const i=(y*cols+j)*4,r=data[i],g=data[i+1],b=data[i+2];let lum=.2126*r+.7152*g+.0722*b,ch;if(mode==='image'){lum=Math.max(0,Math.min(255,(lum-128)*+$('contrast').value+128+ +$('brightness').value));if($('invert').checked)lum=255-lum;const set=sets[$('charset').value];ch=set[Math.round(lum/255*(set.length-1))]}else{const fill=$('ink').value;ch=lum<155?fill[(y+j)%fill.length]:' '}line+=ch;cells.push({ch,r,g,b});if(mode==='image'&&$('color').checked){let s=document.createElement('span');s.textContent=ch;s.style.color=`rgb(${r},${g},${b})`;fragment.append(s)}}lines.push(line);if(mode==='image'&&$('color').checked)fragment.append(document.createTextNode('\n'))}result=lines.join('\n');$('art').replaceChildren();if(mode==='image'&&$('color').checked)$('art').append(fragment);else $('art').textContent=result;$('art').style.fontSize=$('zoom').value+'px';$('stats').textContent=`${cols} × ${rows} · ${cols*rows} 문자`;}
async function loadFile(file){if(!file)return;if(!file.type.startsWith('image/'))return toast('이미지 파일을 선택해 주세요');if(file.size>20*1024*1024)return toast('20MB 이하 이미지를 선택해 주세요');const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{source=img;$('sourceThumb').src=url;$('sourceThumb').hidden=false;setMode(mode==='phrase'?'phrase':'image');URL.revokeObjectURL(url)};img.onerror=()=>{URL.revokeObjectURL(url);toast('읽을 수 없는 이미지 형식입니다')};img.src=url}
$('file').onchange=e=>loadFile(e.target.files[0]);for(const event of ['dragenter','dragover'])$('drop').addEventListener(event,e=>{e.preventDefault();$('drop').classList.add('drag')});for(const event of ['dragleave','drop'])$('drop').addEventListener(event,e=>{e.preventDefault();$('drop').classList.remove('drag');if(event==='drop')loadFile(e.dataTransfer.files[0])});
function sample(){const c=canvas(600,480),x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,600,480);x.fillStyle='#252b22';x.font='bold 340px Georgia';x.textAlign='center';x.textBaseline='middle';x.fillText('@',300,240);source=c;$('sourceThumb').hidden=true;setMode(mode==='phrase'?'phrase':'image')}$('sample').onclick=sample;
for(const el of document.querySelectorAll('input[type=range],input[type=checkbox],select,textarea'))el.addEventListener('input',render);
function download(blob,name){const a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(result);toast(mode==='phrase'?'문구 복사 완료 · 자동 배치 결과는 PNG로 저장':'아스키아트 복사 완료 · 색상은 PNG로 저장')}catch{const t=document.createElement('textarea');t.value=result;document.body.append(t);t.select();let ok=document.execCommand('copy');t.remove();toast(ok?'복사 완료':'복사가 차단됨 · TXT 저장을 이용해 주세요')}};
$('txt').onclick=()=>download(new Blob([result],{type:'text/plain;charset=utf-8'}),'ascii-art.txt');$('png').onclick=()=>{if(mode==='phrase'){$('phraseCanvas').toBlob(b=>b?download(b,'phrase-art.png'):toast('이미지 저장 실패'));return}const c=canvas(cols*8+40,rows*16+40),x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.font='13.333333px "Courier New", monospace';x.textBaseline='top';cells.forEach((p,i)=>{x.fillStyle=mode==='image'&&$('color').checked?`rgb(${p.r},${p.g},${p.b})`:'#272a25';x.fillText(p.ch,20+(i%cols)*8,20+Math.floor(i/cols)*16)});c.toBlob(b=>b?download(b,'ascii-art.png'):toast('이미지 저장 실패'))};sample();
if(document.modelContext?.registerTool){try{Promise.resolve(document.modelContext.registerTool({name:'convert_text_to_ascii',description:'입력 텍스트를 아스키아트로 변환하고 텍스트 모드 결과를 표시합니다',inputSchema:{type:'object',properties:{text:{type:'string',maxLength:100}},required:['text'],additionalProperties:false},annotations:{readOnlyHint:false},execute(input){if(typeof input?.text!=='string'||input.text.length>100)throw Error('text must be a string of at most 100 characters');$('text').value=input.text;setMode('text');return {art:result,columns:cols,rows}}})).catch(()=>{})}catch{}}
</script></body></html>
